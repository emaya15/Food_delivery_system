<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order Tracking Test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
  label { display: block; margin-top: .8rem; font-weight: 600; }
  input { width: 100%; padding: .5rem; box-sizing: border-box; font-family: monospace; }
  button { margin-top: 1rem; padding: .5rem 1rem; }
  #status { margin-top: 1rem; font-weight: 600; }
  #log { margin-top: 1rem; background: #111; color: #9fe; padding: .8rem; height: 320px; overflow: auto;
         font-family: monospace; font-size: 13px; white-space: pre-wrap; border-radius: 6px; }
</style>
</head>
<body>
<h1>Live Order Tracking</h1>
<p>Paste a JWT (from <code>POST /auth/login</code>) and an order ID, then Connect.
   Works for the order's customer, restaurant owner, assigned partner or an admin.</p>
<label for="token">Access token</label>
<input id="token" placeholder="eyJhbGciOi..." autocomplete="off">
<label for="order">Order ID</label>
<input id="order" placeholder="1" inputmode="numeric">
<button id="connect">Connect</button>
<button id="disconnect" disabled>Disconnect</button>
<div id="status">Disconnected</div>
<div id="log" aria-live="polite"></div>
<script>
  let ws = null;
  const $ = (id) => document.getElementById(id);
  function log(msg) {
    const line = document.createElement("div");
    line.textContent = new Date().toLocaleTimeString() + "  " + msg;
    $("log").appendChild(line);
    $("log").scrollTop = $("log").scrollHeight;
  }
  function setState(text, connected) {
    $("status").textContent = text;
    $("connect").disabled = connected;
    $("disconnect").disabled = !connected;
  }
  $("connect").onclick = () => {
    const token = $("token").value.trim(), order = $("order").value.trim();
    if (!token || !/^\d+$/.test(order)) { log("Enter a token and a numeric order ID"); return; }
    const scheme = location.protocol === "https:" ? "wss" : "ws";
    ws = new WebSocket(`${scheme}://${location.host}/ws/orders/${order}?token=${encodeURIComponent(token)}`);
    setState("Connecting...", true);
    ws.onopen = () => { setState("Connected to order " + order, true); log("connected"); };
    ws.onmessage = (e) => {
      try {
        const m = JSON.parse(e.data);
        if (m.type === "order_status") log(`STATUS  ${m.previous_status} -> ${m.status} (by ${m.changed_by})`);
        else if (m.type === "partner_location")
          log(`LOCATION ${m.latitude}, ${m.longitude} | ${m.remaining_distance_km} km left | ETA ${m.estimated_arrival_minutes} min`);
        else log(e.data);
      } catch (_) { log(e.data); }
    };
    ws.onclose = (e) => { setState("Disconnected" + (e.reason ? " (" + e.reason + ")" : ""), false); log("closed code=" + e.code + " " + (e.reason || "")); };
    ws.onerror = () => log("connection error");
  };
  $("disconnect").onclick = () => { if (ws) ws.close(); };
</script>
</body>
</html>
